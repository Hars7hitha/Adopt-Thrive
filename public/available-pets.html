<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Pets - Pet Adoption and Rescue</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: "Comic Sans MS", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        overflow-x: hidden;
      }
      header {
        background-color: #ff6f61;
        color: white;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .logo {
        font-size: 1.5rem;
        font-weight: bold;
        display: flex;
        align-items: center;
      }
      .logo img {
        height: 50px;
        margin-right: 10px;
      }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 1rem;
        transition: color 0.3s, background-color 0.3s;
        padding: 0.5rem 1rem;
        border-radius: 20px;
      }
      nav a:hover {
        color: #ff6f61;
        background-color: white;
      }
      .content {
        padding: 2rem;
        background-color: #fff5ee;
        border-radius: 8px;
        width: 80%;
        margin: 2rem auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
        border: 2px dotted #ff6f61;
        animation: borderFade 2s infinite alternate;
      }
      .content:hover {
        transform: scale(1.02);
      }
      .available-pets {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      .pet {
        background: #ffe4e1;
        margin: 1rem;
        padding: 1rem;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        transition: transform 0.3s, box-shadow 0.3s;
        text-align: center;
      }
      .pet:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }
      .pet img {
        width: 100%;
        border-radius: 10px;
      }
      .pet h3 {
        margin: 0.5rem 0;
      }
      .pet p {
        margin: 0.5rem 0;
        color: #555;
      }
      footer {
        text-align: center;
        padding: 1rem;
        background: #ff6f61;
        color: white;
        box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.2);
      }
      .social-media a {
        color: white;
        text-decoration: none;
        margin: 0 0.5rem;
        transition: color 0.3s;
      }
      .social-media a:hover {
        color: #ff856d;
      }
      @keyframes borderFade {
        from {
          border-color: #ff6f61;
        }
        to {
          border-color: #ff856d;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><img src="logoo.png" alt="Logo" />Adopt & Thrive</div>
      <nav>
        <a href="index.html#home">Home</a>
        <a href="login.html">Login/Register</a>
        <a href="available-pets.html">Available Pets</a>
        <a href="submit-pet.html">Submit a Pet</a>
        <a href="donate.html">Donate</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="about-us.html">About Us</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </header>
    <div class="content">
      <h1>Available Pets</h1>
      <div class="available-pets" id="petList">
        <!-- Pets will be dynamically added here -->
      </div>
    </div>
    <footer>
      <p>&copy; Adopt & Thrive</p>
      <div class="social-media">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        function fetchPets() {
          fetch("/pets")
            .then((response) => response.json())
            .then((pets) => {
              const petList = document.getElementById("petList");
              petList.innerHTML = pets
                .map(
                  (pet) => `
                                <div class="pet">
                                    <img src="${
                                      pet.photo
                                        ? "/" + pet.photo
                                        : "placeholder.jpg"
                                    }" alt="${pet.name}" />
                                    <h3>${pet.name}</h3>
                                    <p>Type: ${pet.type}</p>
                                    <p>Age: ${pet.age}</p>
                                    <p>Size: ${pet.size}</p>
                                    <p>Description: ${pet.description}</p>
                                </div>
                            `
                )
                .join("");
            })
            .catch((error) => {
              console.error("Error fetching pets:", error);
            });
        }

        fetchPets();

        // Re-fetch pets every 10 seconds to update the list dynamically
        setInterval(fetchPets, 10000);
      });
    </script>
  </body>
</html>
