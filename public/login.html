<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login/Register - Pet Adoption and Rescue</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fafafa;
        color: #333;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        max-width: 400px;
        width: 100%;
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .tabs {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .tab {
        padding: 10px 20px;
        cursor: pointer;
        border: 1px solid #ff6f61;
        border-radius: 5px;
        background-color: white;
        color: #ff6f61;
        flex: 1;
        margin: 0 5px;
        transition: background-color 0.3s, color 0.3s;
      }
      .tab.active {
        background-color: #ff6f61;
        color: white;
      }
      .tab.inactive {
        background-color: white;
        color: #ff6f61;
      }
      .form-container {
        display: none;
      }
      .form-container.active {
        display: block;
      }
      .form-container h2 {
        margin-bottom: 20px;
        color: #ff6f61;
      }
      .error {
        color: red;
        margin-bottom: 10px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 16px;
      }
      button {
        width: 100%;
        background-color: #ff6f61;
        color: white;
        border: none;
        padding: 12px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #ff856d;
      }
      #logged-in-message {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="logged-in-message">
        <h2>You are already logged in</h2>
        <button id="sign-out-btn">Sign Out</button>
      </div>

      <div id="login-register-container">
        <div class="tabs">
          <span class="tab active" id="login-tab">Login</span>
          <span class="tab inactive" id="register-tab">Register</span>
        </div>

        <div id="login-form" class="form-container active">
          <h2>Login</h2>
          <div class="error" id="login-error"></div>
          <form id="login-form-element">
            <input
              type="text"
              id="login-username"
              placeholder="Username"
              required
            />
            <input
              type="password"
              id="login-password"
              placeholder="Password"
              required
            />
            <button type="submit">Login</button>
          </form>
        </div>

        <div id="register-form" class="form-container">
          <h2>Register</h2>
          <div class="error" id="register-error"></div>
          <form id="register-form-element">
            <input
              type="text"
              id="register-username"
              placeholder="Username"
              required
            />
            <input
              type="password"
              id="register-password"
              placeholder="Password"
              required
              pattern="(?=.*[a-zA-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}"
              title="Password must be at least 6 characters long and include at least one letter, one number, and one special character."
            />
            <button type="submit">Register</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tabIdToShow, tabIdToHide, activeTabId, inactiveTabId) {
        document.getElementById(tabIdToShow).classList.add("active");
        document.getElementById(tabIdToHide).classList.remove("active");
        document.getElementById(activeTabId).classList.add("active");
        document.getElementById(activeTabId).classList.remove("inactive");
        document.getElementById(inactiveTabId).classList.remove("active");
        document.getElementById(inactiveTabId).classList.add("inactive");
      }

      function checkAuthStatus() {
        const token = sessionStorage.getItem("token");
        if (token) {
          document.getElementById("login-register-container").style.display =
            "none";
          document.getElementById("logged-in-message").style.display = "block";
        } else {
          document.getElementById("login-register-container").style.display =
            "block";
          document.getElementById("logged-in-message").style.display = "none";
        }
      }

      function signOut() {
        sessionStorage.removeItem("token");
        window.location.reload(); // Reload the page to reset the view
      }

      document.getElementById("login-tab").addEventListener("click", () => {
        switchTab("login-form", "register-form", "login-tab", "register-tab");
      });

      document.getElementById("register-tab").addEventListener("click", () => {
        switchTab("register-form", "login-form", "register-tab", "login-tab");
      });

      document
        .getElementById("login-form-element")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const username = document.getElementById("login-username").value;
          const password = document.getElementById("login-password").value;
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get("redirect") || "index.html"; // Default to homepage if no redirect is provided

          fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.token) {
                sessionStorage.setItem("token", data.token);
                window.location.href = redirectUrl; // Redirect to the original page or default to homepage
              } else {
                showAlert("Invalid username or password. Please try again.");
              }
            })
            .catch((error) => console.error("Error:", error));
        });

      document
        .getElementById("register-form-element")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const username = document.getElementById("register-username").value;
          const password = document.getElementById("register-password").value;

          fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          })
            .then((response) => {
              if (response.ok) {
                alert("User registered successfully");
                document.getElementById("login-tab").click(); // Switch to login form
              } else {
                response.text().then((text) => {
                  document.getElementById("register-error").textContent = text;
                });
              }
            })
            .catch((error) => console.error("Error:", error));
        });

      // Function to show an alert popup
      function showAlert(message) {
        alert(message);
      }

      document
        .getElementById("sign-out-btn")
        .addEventListener("click", signOut);

      // Check auth status on page load
      checkAuthStatus();
    </script>
  </body>
</html>
